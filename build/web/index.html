<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Murach's Survey</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <!-- Logo HCMUTE / Murach -->
    <img src="images/murach_logo.png" alt="Murach Logo" class="logo">

    <h1>Survey</h1>
    <p>If you have a moment, we'd appreciate it if you would fill out this survey.</p>

    <form action="emailList" method="post">
        <!-- Đặt action=add để Servlet nhận biết yêu cầu gửi form -->
        <input type="hidden" name="action" value="add">

        <!-- Section 1: Thông tin cá nhân -->
        <h3>Your information:</h3>
        
        <label for="firstName">First Name</label>
        <input type="text" id="firstName" name="firstName" required><br>

        <label for="lastName">Last Name</label>
        <input type="text" id="lastName" name="lastName" required><br>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required><br>

        <label for="dateOfBirth">Date of Birth</label>
        <input type="text" id="dateOfBirth" name="dateOfBirth"><br>

        <!-- Section 2: Phương thức biết đến website -->
        <h3>How did you hear about us?</h3>
        <input type="radio" id="search" name="hearFrom" value="Search engine" checked>
        <label for="search" style="float:none; width:auto;">Search engine</label>

        <input type="radio" id="word" name="hearFrom" value="Word of mouth">
        <label for="word" style="float:none; width:auto;">Word of mouth</label>

        <input type="radio" id="social" name="hearFrom" value="Social Media">
        <label for="social" style="float:none; width:auto;">Social Media</label>

        <input type="radio" id="other" name="hearFrom" value="Other">
        <label for="other" style="float:none; width:auto;">Other</label>
        <br>

        <!-- Section 3: Đăng ký nhận thông báo -->
        <h3>Would you like to receive announcements about new CDs and special offers?</h3>
        
        <input type="checkbox" id="wantsUpdates" name="wantsUpdates" value="Yes">
        <label for="wantsUpdates" style="float:none; width:auto;">YES, I'd like that.</label>
        <br><br>

        <input type="checkbox" id="emailAnnouncements" name="emailAnnouncements" value="Yes">
        <label for="emailAnnouncements" style="float:none; width:auto;">YES, please send me email announcements.</label>
        <br><br>

        <!-- Section 4: Lựa chọn hình thức liên hệ -->
        <label for="contactVia" class="contact-label">Please contact me by:</label>
        <select id="contactVia" name="contactVia">
            <option value="Email or postal mail">Email or postal mail</option>
            <option value="Email only">Email only</option>
            <option value="Postal mail only">Postal mail only</option>
        </select>
        <br><br>

        <!-- Nút gửi form -->
        <input type="submit" id="submit" value="Submit">
    </form>
</body>
</html>
